# docker-compose.yml — Local development stack for tax-portal
#
# This file brings up the DATA-PLANE services for local development and testing.
# App services (portal, admin) are intentionally deferred to TASK-004 when apps/portal
# and apps/admin exist. See TASK-002 Work Log — compose split decision.
#
# References:
#   ADR-002 — SQL Server 2022 Developer in Docker
#   ADR-006 — compose at repo root
#   ADR-007 — deploy-agnostic; SQL authentication via env secret, NO Managed Identity
#   ADR-008 — Azurite blob emulator in the stack
#   CLAUDE.md § Port assignments

services:
  # ─── SQL Server 2022 Developer Edition ────────────────────────────────────────
  # ADR-002: image must be mcr.microsoft.com/mssql/server:2022-latest
  # ADR-007: SQL authentication only (SA_PASSWORD from env, never hard-coded)
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tax-portal-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:?SA_PASSWORD env var is required}"
      MSSQL_PID: Developer
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -No -Q 'SELECT 1' 2>/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # ─── Azurite — Azure Blob Storage Emulator ────────────────────────────────────
  # ADR-008: Azurite blob emulator belongs in the stack; storage adapter is a later epic
  # but the emulator is available from day one so tier-3 integration tests can use it.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: tax-portal-azurite
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --loose --skipApiVersionCheck
    ports:
      - "${AZURITE_PORT:-10000}:10000"
    volumes:
      - azurite-data:/data
    healthcheck:
      # Azurite returns 400 on an unauthenticated root request — that proves it's up.
      # node is available in the Azurite image; nc/curl/wget are not.
      test:
        [
          "CMD",
          "node",
          "-e",
          "const http = require('http'); const req = http.get('http://localhost:10000/', (r) => { process.exit(r.statusCode === 400 ? 0 : 1); }); req.on('error', () => process.exit(1));",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ─── Mailhog — Mail Catcher ───────────────────────────────────────────────────
  # Catches outbound email in local dev. Web UI at http://localhost:8025
  # SMTP port 1025 is also exposed for any service that sends email.
  mailhog:
    image: mailhog/mailhog:latest
    container_name: tax-portal-mailhog
    ports:
      - "${MAILHOG_HTTP_PORT:-8025}:8025" # Web UI
      - "${MAILHOG_SMTP_PORT:-1025}:1025" # SMTP
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8025 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ─── Client Portal (apps/portal) ──────────────────────────────────────────────
  # Added in TASK-004 (per apps/portal/Dockerfile comment — ADR-007 per-app image).
  # ADR-006: Client Portal runs on port 3000, the primary client-facing frontend.
  # REQ-DOOR-004: The public front door — anonymous access to /services and /request.
  # Probed by scripts/smoke-test.sh at /healthz and /readyz.
  portal:
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
      # DECISION-016-005b-RT: NEXT_PUBLIC_* vars must be baked into the browser bundle at
      # `next build` time. Docker runtime `environment:` vars arrive too late — the bundle
      # is already compiled. Pass them as build ARGs so `next build` sees them.
      # The Dockerfile builder stage accepts these via ARG + ENV. // ADR-023
      args:
        NEXT_PUBLIC_REALTIME_PROVIDER: "${NEXT_PUBLIC_REALTIME_PROVIDER:-mock}"
        NEXT_PUBLIC_ALLOW_MOCK_REALTIME: "${NEXT_PUBLIC_ALLOW_MOCK_REALTIME:-true}"
    container_name: tax-portal-portal
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # Admin pool — used by getActiveServices() and createEngagementRequest() (ADR-003 §1/§6).
      # IMPORTANT: The portal container uses PORTAL_DATABASE_URL_ADMIN (not DATABASE_URL_ADMIN).
      # DATABASE_URL_ADMIN in .env.local uses localhost:SQLSERVER_PORT (host-side for scripts).
      # PORTAL_DATABASE_URL_ADMIN must use the compose service name "sqlserver" (internal Docker DNS)
      # with port 1433. Set PORTAL_DATABASE_URL_ADMIN in .env.local to the container-side URL.
      # See .env.example for the required format.
      DATABASE_URL_ADMIN: "${PORTAL_DATABASE_URL_ADMIN:?PORTAL_DATABASE_URL_ADMIN env var is required — use sqlserver://sqlserver;port=1433;... (container-internal hostname)}"
      # Request pool — wired into the lazy Prisma client (EPIC-004 will use it; TASK-006 fix-forward).
      # Belt-and-suspenders alongside the lazy-init fix (BUG-001-003): having the URL present in the
      # container prevents PrismaClientConstructorValidationError on any path that touches requestDb.
      # Must use the compose service name "sqlserver" (internal Docker DNS), not localhost.
      DATABASE_URL: "${PORTAL_DATABASE_URL:?PORTAL_DATABASE_URL env var is required — use sqlserver://sqlserver;port=1433;... (container-internal hostname)}"
      # Auth provider binding — "mock" for e2e/local dev (no real Clerk keys needed).
      # Set to "clerk" in production once TASK-004-003 wires the real Clerk integration.
      # ADR-001 / ADR-010 / TASK-004-002
      AUTH_PROVIDER: "${AUTH_PROVIDER:-mock}"
      # Mock-auth opt-in — required for the prod-built container to serve the mock provider
      # (BUG-002-001 fix: the fail-closed guard in packages/auth keys on this flag, not NODE_ENV).
      # Default true for e2e/local containers. NEVER set to "true" in a real production deploy
      # (a real deploy uses AUTH_PROVIDER=clerk and leaves ALLOW_MOCK_AUTH unset → fail closed).
      ALLOW_MOCK_AUTH: "${ALLOW_MOCK_AUTH:-true}"
      # Cross-app redirect URLs (ADR-010)
      PORTAL_APP_URL: "${PORTAL_APP_URL:-http://localhost:3000}"
      ADMIN_APP_URL: "${ADMIN_APP_URL:-http://localhost:3001}"
      # Mock session secret (AUTH_PROVIDER=mock only; must NOT be set in production).
      # Required — no default. Generate a random secret: openssl rand -hex 32
      # See .env.example for the required format.
      MOCK_SESSION_SECRET: "${MOCK_SESSION_SECRET:?MOCK_SESSION_SECRET env var is required — generate with: openssl rand -hex 32}"
      # Placeholder for Clerk (TASK-004-003) — not used in this slice
      # NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}"
      # Email transport (REQ-NFR-008 / TASK-003-002 — packages/email seam).
      # "smtp" → Mailhog catcher (local/e2e default).
      # "resend" → deferred production drop-in (requires RESEND_API_KEY).
      EMAIL_PROVIDER: "${EMAIL_PROVIDER:-smtp}"
      SMTP_HOST: "mailhog"
      SMTP_PORT: "1025"
      EMAIL_FROM: "${EMAIL_FROM:-noreply@tax-portal.dev}"
      # Rate limiter — elevated for e2e/local dev so sequential test runs don't exhaust the window.
      # Default: 10/60s (production). Local/e2e: 100/60s — prevents InMemoryRateLimiter exhaustion
      # across 3× sequential pnpm e2e:run invocations (BUG-003-001 fix).
      # Override via .env.local if needed; "100" safely covers the worst-case sequential test load.
      RATE_LIMIT_MAX_ATTEMPTS: "${RATE_LIMIT_MAX_ATTEMPTS:-100}"
      RATE_LIMIT_WINDOW_MS: "${RATE_LIMIT_WINDOW_MS:-60000}"
      # E-sign provider binding — "mock" for e2e/local dev (no real Docuseal API needed).
      # Set to "docuseal" in production once the real Docuseal enablement slice lands (ADR-024 §5).
      # ADR-023 §4 / DECISION-E: default = docuseal (real); mock requires ALLOW_MOCK_ESIGN=true.
      # NEVER set ALLOW_MOCK_ESIGN=true in a real production deploy — a real deploy uses
      # ESIGN_PROVIDER=docuseal and leaves ALLOW_MOCK_ESIGN unset → fail closed (throws on mock).
      ESIGN_PROVIDER: "${ESIGN_PROVIDER:-mock}"
      ALLOW_MOCK_ESIGN: "${ALLOW_MOCK_ESIGN:-true}"
      # Object storage (packages/storage — FileStorage port — ADR-008).
      # "azurite" adapter connects to the Azurite container at internal hostname "azurite":10000.
      # STORAGE_ADAPTER=cloud throws at startup (fail-closed boot — no production adapter in this build).
      # STORAGE_ADAPTER=memory is test-only; not valid for runtime use.
      STORAGE_ADAPTER: "${STORAGE_ADAPTER:-azurite}"
      STORAGE_CONNECTION_STRING: "${PORTAL_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1}"
      STORAGE_CONTAINER: "${STORAGE_CONTAINER:-tax-portal-documents}"
      # BLOB_PUBLIC_ENDPOINT — rewrites the Azurite signed upload URL's origin before
      # returning it to the client browser. The portal server generates SAS URLs using the
      # Docker-internal hostname "azurite:10000" (PORTAL_STORAGE_CONNECTION_STRING). The
      # browser (running on the host machine) cannot resolve "azurite" — it must use
      # localhost with the mapped port. This variable tells requestUploadUrlAction to swap
      # the origin so the browser can PUT bytes directly to Azurite (ADR-009).
      # Set to the host-accessible Azurite base URL. Leave unset in production (real Azure
      # has a single public URL; no rewrite needed).
      BLOB_PUBLIC_ENDPOINT: "${BLOB_PUBLIC_ENDPOINT:-http://localhost:10000}"
      # File scanner binding — "mock" for e2e/local dev (no real AV engine needed).
      # MockFileScanner returns 'clean' for all files (unless EICAR test content triggers
      # the infected path). ALLOW_MOCK_SCANNER=true opts into the mock binding.
      # Set FILE_SCANNER=cloud and leave ALLOW_MOCK_SCANNER unset for real production.
      # ADR-021 §4: fail-closed default is cloud (deferred stub); mock requires explicit opt-in.
      FILE_SCANNER: "${FILE_SCANNER:-mock}"
      ALLOW_MOCK_SCANNER: "${ALLOW_MOCK_SCANNER:-true}"
      # Real-time notification transport (packages/realtime — ADR-023).
      # EPIC-016 / TASK-016-003: "mock" for e2e/local dev (in-process fan-out; no real provider).
      # ALLOW_MOCK_REALTIME=true opts into the mock binding (fail-closed — throws if unset with mock).
      # Set to "supabase-realtime" (or the final real provider) in production.
      # NEVER set ALLOW_MOCK_REALTIME=true in a real production deploy.
      REALTIME_PROVIDER: "${REALTIME_PROVIDER:-mock}"
      ALLOW_MOCK_REALTIME: "${ALLOW_MOCK_REALTIME:-true}"
      # NEXT_PUBLIC_ variants — DECISION-016-005b-RT (TASK-016-005b / ADR-023):
      # Next.js only inlines NEXT_PUBLIC_* env vars into the browser bundle at build time.
      # The browser process cannot read server-only env vars (REALTIME_PROVIDER, ALLOW_MOCK_REALTIME).
      # Without NEXT_PUBLIC_ variants, the browser defaults to SupabaseRealtimeTransport (stub), which
      # throws at subscribe() time — BUG-016-001 root cause.
      # The selector (packages/realtime/src/select.ts) reads NEXT_PUBLIC_* as a fallback when the
      # server-side var is absent (browser context). Set to the same values as the server vars here.
      # SECURITY: these are selector values, not secrets. The mock is only reachable when
      # ALLOW_MOCK_REALTIME=true. NEVER set NEXT_PUBLIC_ALLOW_MOCK_REALTIME=true in a real production
      # deploy (a real deploy leaves ALLOW_MOCK_REALTIME unset → fail closed). // ADR-023 §4
      NEXT_PUBLIC_REALTIME_PROVIDER: "${NEXT_PUBLIC_REALTIME_PROVIDER:-mock}"
      NEXT_PUBLIC_ALLOW_MOCK_REALTIME: "${NEXT_PUBLIC_ALLOW_MOCK_REALTIME:-true}"
    ports:
      - "${PORTAL_PORT:-3000}:3000"
    depends_on:
      sqlserver:
        condition: service_healthy
      azurite:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const http = require('http'); http.get('http://localhost:3000/healthz', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));",
        ]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  # ─── Tax Portal (apps/admin) ──────────────────────────────────────────────────
  # Added in TASK-004-001 (BRIEF-004). ADR-006: Tax Portal runs on port 3001 (accountant-facing).
  # ADR-007: Per-app container image; production platform deferred.
  # ADR-010: apps/admin has NO public routes — every path requires ACCOUNTANT auth.
  #          Auth middleware (Clerk) lands in TASK-004-002; healthz/readyz pass through.
  # Probed by scripts/smoke-test.sh at /healthz and /readyz.
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      # DECISION-016-005b-RT: Same build-time baking for the admin surface (TASK-016-006).
      # See portal service comment above for full rationale. // ADR-023
      args:
        NEXT_PUBLIC_REALTIME_PROVIDER: "${NEXT_PUBLIC_REALTIME_PROVIDER:-mock}"
        NEXT_PUBLIC_ALLOW_MOCK_REALTIME: "${NEXT_PUBLIC_ALLOW_MOCK_REALTIME:-true}"
    container_name: tax-portal-admin
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
      # Admin pool — used by DB queries (ADR-003 §1/§6).
      # IMPORTANT: Uses the compose service name "sqlserver" (internal Docker DNS, port 1433).
      # ADMIN_DATABASE_URL_ADMIN in .env.local must use the container-side URL.
      # See .env.example for the required format.
      DATABASE_URL_ADMIN: "${ADMIN_DATABASE_URL_ADMIN:?ADMIN_DATABASE_URL_ADMIN env var is required — use sqlserver://sqlserver;port=1433;... (container-internal hostname)}"
      # Request pool — wired into the lazy Prisma client (EPIC-004 will use it).
      # Must use the compose service name "sqlserver" (internal Docker DNS), not localhost.
      DATABASE_URL: "${ADMIN_DATABASE_URL:?ADMIN_DATABASE_URL env var is required — use sqlserver://sqlserver;port=1433;... (container-internal hostname)}"
      # Cross-app URLs for redirect wiring (ADR-010)
      PORTAL_APP_URL: "${PORTAL_APP_URL:-http://localhost:3000}"
      ADMIN_APP_URL: "${ADMIN_APP_URL:-http://localhost:3001}"
      # Auth provider binding — "mock" for e2e/local dev (no real Clerk keys needed).
      # Set to "clerk" in production once TASK-004-003 wires the real Clerk integration.
      # ADR-001 / ADR-010 / TASK-004-002
      AUTH_PROVIDER: "${AUTH_PROVIDER:-mock}"
      # Mock-auth opt-in — required for the prod-built container to serve the mock provider
      # (BUG-002-001 fix: the fail-closed guard in packages/auth keys on this flag, not NODE_ENV).
      # Default true for e2e/local containers. NEVER set to "true" in a real production deploy
      # (a real deploy uses AUTH_PROVIDER=clerk and leaves ALLOW_MOCK_AUTH unset → fail closed).
      ALLOW_MOCK_AUTH: "${ALLOW_MOCK_AUTH:-true}"
      # Mock session secret (AUTH_PROVIDER=mock only; must NOT be set in production).
      # Required — no default. Generate a random secret: openssl rand -hex 32
      # See .env.example for the required format.
      MOCK_SESSION_SECRET: "${MOCK_SESSION_SECRET:?MOCK_SESSION_SECRET env var is required — generate with: openssl rand -hex 32}"
      # Placeholder for Clerk (TASK-004-003) — not used in this slice
      # NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}"
      # Email transport (REQ-NFR-008 / TASK-003-002 — packages/email seam).
      # "smtp" → Mailhog catcher (local/e2e default).
      # "resend" → deferred production drop-in (requires RESEND_API_KEY).
      EMAIL_PROVIDER: "${EMAIL_PROVIDER:-smtp}"
      SMTP_HOST: "mailhog"
      SMTP_PORT: "1025"
      EMAIL_FROM: "${EMAIL_FROM:-noreply@tax-portal.dev}"
      # Rate limiter — elevated for e2e/local dev so sequential test runs don't exhaust the window.
      # Default: 10/60s (production). Local/e2e: 100/60s — prevents InMemoryRateLimiter exhaustion
      # across 3× sequential pnpm e2e:run invocations (BUG-003-001 fix).
      # Override via .env.local if needed; "100" safely covers the worst-case sequential test load.
      RATE_LIMIT_MAX_ATTEMPTS: "${RATE_LIMIT_MAX_ATTEMPTS:-100}"
      RATE_LIMIT_WINDOW_MS: "${RATE_LIMIT_WINDOW_MS:-60000}"
      # Dev/test-only trigger seam for dispatchDailyDigest (TASK-018-003 / BRIEF-018).
      # The route /api/dev/dispatch-digest returns 404 unless this is "true".
      # PRODUCTION SAFETY: MUST NOT be set to "true" in a real production deployment.
      # Defaults to "false" — must be explicitly set to "true" for e2e runs that need
      # the digest trigger. Set ENABLE_DIGEST_TRIGGER=true in your .env.local or the
      # e2e compose override when running digest-related e2e tests.
      # ADR-023: production scheduling is deferred; this flag enables the dev/test seam only.
      # // ADR-023 // DECISION-018-003-C
      ENABLE_DIGEST_TRIGGER: "${ENABLE_DIGEST_TRIGGER:-false}"
      # Object storage (packages/storage — FileStorage port — ADR-008).
      # Added in TASK-013-003: apps/admin now has @tax-portal/storage dependency for the
      # accountant upload + version-replace surface (ADR-006 — upload is admin-only).
      # "azurite" adapter connects to the Azurite container at internal hostname "azurite":10000.
      STORAGE_ADAPTER: "${STORAGE_ADAPTER:-azurite}"
      STORAGE_CONNECTION_STRING: "${ADMIN_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1}"
      STORAGE_CONTAINER: "${STORAGE_CONTAINER:-tax-portal-documents}"
      # BLOB_PUBLIC_ENDPOINT — rewrites the Azurite signed upload URL's origin before
      # returning it to the client browser. The admin server generates SAS URLs using the
      # Docker-internal hostname "azurite:10000". The browser (running on the host machine)
      # cannot resolve "azurite" — it must use localhost with the mapped port.
      # Set to the host-accessible Azurite base URL. Leave unset in production (real Azure
      # has a single public URL; no rewrite needed).
      BLOB_PUBLIC_ENDPOINT: "${BLOB_PUBLIC_ENDPOINT:-http://localhost:10000}"
      # File scanner binding — "mock" for e2e/local dev (no real AV engine needed).
      # Same as portal service — admin upload path also passes through the scan-promote gate
      # (ADR-021). ALLOW_MOCK_SCANNER=true opts into the mock binding.
      FILE_SCANNER: "${FILE_SCANNER:-mock}"
      ALLOW_MOCK_SCANNER: "${ALLOW_MOCK_SCANNER:-true}"
      # Real-time notification transport (packages/realtime — ADR-023).
      # EPIC-016 / TASK-016-003: "mock" for e2e/local dev (in-process fan-out; no real provider).
      # ALLOW_MOCK_REALTIME=true opts into the mock binding (fail-closed — throws if unset with mock).
      # Set to "supabase-realtime" (or the final real provider) in production.
      # NEVER set ALLOW_MOCK_REALTIME=true in a real production deploy.
      REALTIME_PROVIDER: "${REALTIME_PROVIDER:-mock}"
      ALLOW_MOCK_REALTIME: "${ALLOW_MOCK_REALTIME:-true}"
      # NEXT_PUBLIC_ variants — DECISION-016-005b-RT (TASK-016-005b / ADR-023):
      # Mirrors portal service above. TASK-016-006 (admin badge) consumes the same SSE-backed
      # browser transport for the ACCOUNTANT channel ("accountant:notifications").
      # See portal service comment above for the full rationale. // ADR-023 // ADR-006
      NEXT_PUBLIC_REALTIME_PROVIDER: "${NEXT_PUBLIC_REALTIME_PROVIDER:-mock}"
      NEXT_PUBLIC_ALLOW_MOCK_REALTIME: "${NEXT_PUBLIC_ALLOW_MOCK_REALTIME:-true}"
    ports:
      - "${ADMIN_PORT:-3001}:3001"
    depends_on:
      sqlserver:
        condition: service_healthy
      azurite:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const http = require('http'); http.get('http://localhost:3001/healthz', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));",
        ]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  # ─── Docuseal (reserved for TASK-XXX / Epic-003) ─────────────────────────────
  # Docuseal self-hosted e-sign service and its Postgres DB are deferred until the
  # onboarding epic. Uncomment when that epic lands.
  #
  # docuseal-postgres:
  #   image: postgres:15-alpine
  #   container_name: tax-portal-docuseal-postgres
  #   environment:
  #     POSTGRES_DB: docuseal
  #     POSTGRES_USER: docuseal
  #     POSTGRES_PASSWORD: "${DOCUSEAL_PG_PASSWORD:?DOCUSEAL_PG_PASSWORD env var is required}"
  #   volumes:
  #     - docuseal-postgres-data:/var/lib/postgresql/data
  #   restart: unless-stopped
  #
  # docuseal:
  #   image: docuseal/docuseal:latest
  #   container_name: tax-portal-docuseal
  #   ports:
  #     - "3005:3000"
  #   environment:
  #     DATABASE_URL: "postgres://docuseal:${DOCUSEAL_PG_PASSWORD}@docuseal-postgres:5432/docuseal"
  #     SECRET_KEY_BASE: "${DOCUSEAL_SECRET_KEY_BASE:?DOCUSEAL_SECRET_KEY_BASE env var is required}"
  #   depends_on:
  #     docuseal-postgres:
  #       condition: service_healthy
  #   restart: unless-stopped

# ─── Named Volumes ─────────────────────────────────────────────────────────────
volumes:
  sqlserver-data:
    name: tax-portal-sqlserver-data
  azurite-data:
    name: tax-portal-azurite-data
