name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  issues: write
  security-events: write

jobs:
  lint-and-typecheck:
    name: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            pnpm install --frozen-lockfile
          else
            echo "No package.json found — workspace not yet scaffolded. Skipping install."
          fi

      - name: pnpm lint
        run: |
          if [ ! -f package.json ]; then
            echo "No package.json — workspace not yet scaffolded. Skipping lint."
            exit 0
          fi
          pnpm lint

      - name: pnpm type-check
        run: |
          if [ ! -f package.json ]; then
            echo "No package.json — workspace not yet scaffolded. Skipping type-check."
            exit 0
          fi
          pnpm type-check

  test-portal:
    name: test-portal
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          SA_PASSWORD: ${{ secrets.CI_SA_PASSWORD || 'CIPlaceholderPwd1!' }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P \"$SA_PASSWORD\" -Q \"SELECT 1\" -No"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify SQL Server is reachable
        run: |
          /opt/mssql-tools18/bin/sqlcmd -S localhost,1433 -U SA -P "${SA_PASSWORD}" -Q "SELECT @@VERSION" -No
        env:
          SA_PASSWORD: ${{ secrets.CI_SA_PASSWORD || 'CIPlaceholderPwd1!' }}

      - name: pnpm --filter portal test
        run: pnpm --filter portal test
        env:
          DATABASE_URL: sqlserver://localhost:1433;database=master;user=SA;password=${{ secrets.CI_SA_PASSWORD || 'CIPlaceholderPwd1!' }};trustServerCertificate=true

  test-admin:
    name: test-admin
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          SA_PASSWORD: ${{ secrets.CI_SA_PASSWORD || 'CIPlaceholderPwd1!' }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P \"$SA_PASSWORD\" -Q \"SELECT 1\" -No"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify SQL Server is reachable
        run: |
          /opt/mssql-tools18/bin/sqlcmd -S localhost,1433 -U SA -P "${SA_PASSWORD}" -Q "SELECT @@VERSION" -No
        env:
          SA_PASSWORD: ${{ secrets.CI_SA_PASSWORD || 'CIPlaceholderPwd1!' }}

      - name: pnpm --filter admin test
        run: pnpm --filter admin test
        env:
          DATABASE_URL: sqlserver://localhost:1433;database=master;user=SA;password=${{ secrets.CI_SA_PASSWORD || 'CIPlaceholderPwd1!' }};trustServerCertificate=true

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            pnpm install --frozen-lockfile
          else
            echo "No package.json found — workspace not yet scaffolded. Skipping install."
          fi

      - name: pnpm audit (high+critical)
        run: |
          if [ ! -f pnpm-lock.yaml ]; then
            echo "No pnpm-lock.yaml — workspace not yet scaffolded. Skipping audit."
            exit 0
          fi
          pnpm audit --audit-level=high

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  report-failure:
    name: report-failure
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test-portal, test-admin, security-scan]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Create failure issue
        run: |
          gh issue create \
            --label ci-failure \
            --title "CI red on main: ${{ github.sha }}" \
            --body "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Failing jobs: see run page.

          Auto-created by .github/workflows/ci.yml — close after fix lands."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
